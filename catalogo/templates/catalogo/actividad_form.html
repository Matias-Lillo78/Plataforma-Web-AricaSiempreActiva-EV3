{% extends 'sitio/base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<section class="container py-5 col-md-6">
    <h1>{{ accion }} actividad</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form|crispy }}
        <button class="btn btn-primary" type="submit">{{ accion }}</button>
        <a href="{% url 'mis-actividades' %}" class="btn btn-light">Volver</a>
    </form>
</section>
{% endblock content %}
